# Auto-append changelog entries when a release round is pushed to main.
#
# The changelog is PUBLIC and customer-facing. A round only appears if its
# commit body carries a "Changelog:" block written for customers:
#
#   Round 73: weekly digest emails
#
#   Changelog [feature]: Weekly performance digests
#   Digests arrive every Monday and summarise replies, leads and top posts.
#   - Pick the day and time your digest is sent
#
#   ...rest of the body, ignored...
#
# Commits without that block publish nothing, and the generator drops any
# line that names files, functions, databases, frameworks or security work.
# See scripts/update-changelog.mjs for the full rules before editing either.
name: Update changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changelog:
    # Skip docs-only chores and the changelog's own commits
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(changelog)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Append new changelog entries from commits
        run: node scripts/update-changelog.mjs

      - name: Commit if changed
        run: |
          git config user.name "changelog-bot"
          git config user.email "actions@github.com"
          git add src/data/changelog.json
          git diff --cached --quiet || git commit -m "chore(changelog): auto-update"
          git push
